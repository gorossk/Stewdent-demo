name: Verify public demo
on:
  push:
    branches: [main]
    paths: ['index.html', 'assets/**', '.github/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-demo-verification
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: https://gorossk.github.io/Stewdent-demo/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser checker
        run: |
          echo "CHECK_DIR=$RUNNER_TEMP/stewdent-browser-check" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/stewdent-browser-check" @playwright/test@1.64.1 --no-audit --no-fund --ignore-scripts
          "$RUNNER_TEMP/stewdent-browser-check/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify live demo
        run: node .github/check-demo.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-demo-browser-evidence
          path: site-evidence/
